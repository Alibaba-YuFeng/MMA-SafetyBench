[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mma-safetybench"
version = "0.1.0"
description = "Multimodal agent safety evaluation utilities"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "Pillow>=10,<13", "openai>=1.40,<3", "pandas>=2,<3"]

[project.optional-dependencies]
video = ["numpy>=1.26,<3", "opencv-python-headless>=4.9,<5", "chromadb>=0.5,<2"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
mma-bench = "mma_safetybench.cli:main"

[tool.setuptools.packages.find]
include = ["mma_safetybench*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
